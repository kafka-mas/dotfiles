general {
    lock_cmd = pidof hyprlock || hyprlock       # Команда для блокировки по DBus
    before_sleep_cmd = loginctl lock-session    # Блокировать сессию перед сном
    after_sleep_cmd = hyprctl dispatch dpms on  # Включить дисплей после пробуждения
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 300                               # 5 минут
    on-timeout = loginctl lock-session          # Блокировать экран при простое
}

listener {
    timeout = 330                                                     # 5.5min
    on-timeout = hyprctl dispatch dpms off                            # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 600                               # 10 минут
    on-timeout = systemctl suspend-then-hibernate              # Перевести систему в сон
}
